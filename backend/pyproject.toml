[project]
name = "milt-backend"
version = "0.1.0"
description = "MILT AI - backend local-first (FastAPI + Ollama)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8,<3",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Perfil servidor (PostgreSQL). No se necesita en local.
server = ["asyncpg>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "anyio>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette avisa de un futuro cambio de cliente HTTP en su TestClient; no afecta a la app.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "ollama: pruebas contra un servidor Ollama real (requiere MILT_TEST_OLLAMA=1)",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    "B008",   # Depends() en argumentos por defecto es el patrón de FastAPI
    "RUF001", # caracteres ambiguos en textos en español
    "RUF002",
    "RUF003",
    "UP046",  # Generic[T] explícito: más claro con modelos genéricos de Pydantic
    "PT018",  # se permiten aserciones compuestas en pruebas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
